<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Breakout Terminal & Account Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0a0d12] text-gray-200 font-sans min-h-screen flex flex-col">

    <header class="border-b border-[#1f293d] bg-[#121824]/80 px-4 py-3 flex justify-between items-center">
        <h1 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-chart-line text-blue-500"></i> MT5 LOCAL ORCHESTRATOR TERMINAL
        </h1>
        <div class="flex items-center gap-3">
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
                <i class="fa-solid fa-user-plus mr-1"></i> Connect MT5 Account
            </button>
            <div id="connectionStatus" class="text-xs font-mono px-2 py-1 rounded bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">
                Connecting...
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1">
        <!-- Chart Section -->
        <div class="lg:col-span-8 bg-[#121824] border border-[#1f293d] rounded-xl p-4 flex flex-col">
            <div class="flex justify-between items-center pb-3 mb-3 border-b border-[#1f293d] text-sm">
                <span id="symbolDisplay" class="font-mono font-bold text-white">XAUUSD</span>
                <span class="text-gray-400">Live Price: <strong id="priceDisplay" class="text-emerald-400">$0.00</strong></span>
            </div>
            <div class="relative w-full h-[380px] bg-[#0a0d12] rounded border border-[#1f293d]/60 flex items-center justify-center">
                <canvas id="chartCanvas" class="w-full h-full"></canvas>
            </div>
        </div>

        <!-- Signal & Connected Accounts Sidebar -->
        <div class="lg:col-span-4 flex flex-col gap-5">
            <div class="bg-[#121824] border border-[#1f293d] rounded-xl p-5 flex flex-col gap-4">
                <h3 class="text-xs font-bold uppercase text-gray-400">Signal & Confluence</h3>
                <div id="signalBox" class="p-4 bg-[#0a0d12] rounded-xl border border-[#1f293d] text-center">
                    <div id="signalBadge" class="text-xl font-black text-gray-500">WAITING FOR LOGIN</div>
                    <div id="scoreDisplay" class="text-xs font-mono text-gray-400 mt-1">Confluence Score: 0%</div>
                </div>
            </div>

            <div class="bg-[#121824] border border-[#1f293d] rounded-xl p-5 flex flex-col gap-3">
                <h3 class="text-xs font-bold uppercase text-gray-400">Connected Accounts</h3>
                <div id="accountsList" class="space-y-2 text-xs font-mono">
                    <span class="text-gray-500">No accounts connected yet. Click "Connect MT5 Account" above.</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Connect Account Modal -->
    <div id="accountModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#121824] border border-[#1f293d] rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-[#1f293d] pb-3">
                <h3 class="text-sm font-bold text-white"><i class="fa-solid fa-server mr-2 text-blue-500"></i>Enter MT5 Credentials</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="submitAccount(event)" class="space-y-3">
                <div>
                    <label class="text-[11px] text-gray-400">Account Number (Login)</label>
                    <input type="number" id="login" required class="w-full bg-[#0a0d12] border border-[#1f293d] rounded p-2 text-xs text-white mt-1">
                </div>
                <div>
                    <label class="text-[11px] text-gray-400">Master Password</label>
                    <input type="password" id="password" required class="w-full bg-[#0a0d12] border border-[#1f293d] rounded p-2 text-xs text-white mt-1">
                </div>
                <div>
                    <label class="text-[11px] text-gray-400">Broker Server Name</label>
                    <input type="text" id="server" placeholder="e.g. ICMarketsSC-Demo" required class="w-full bg-[#0a0d12] border border-[#1f293d] rounded p-2 text-xs text-white mt-1">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-xs transition mt-2">
                    Connect & Authorize
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        let chartCandles = [];

        function openModal() { document.getElementById('accountModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('accountModal').classList.add('hidden'); }

        async function submitAccount(e) {
            e.preventDefault();
            const payload = {
                login: parseInt(document.getElementById('login').value),
                password: document.getElementById('password').value,
                server: document.getElementById('server').value,
                active_pairs: ["XAUUSD"]
            };

            try {
                const res = await fetch(`${API_URL}/api/accounts/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                alert(data.message);
                if (data.status === 'SUCCESS') {
                    closeModal();
                    fetchAccounts();
                }
            } catch (err) {
                alert('Failed to connect to local Python bridge backend.');
            }
        }

        async function fetchAccounts() {
            try {
                const res = await fetch(`${API_URL}/api/accounts/list`);
                const accounts = await res.json();
                const container = document.getElementById('accountsList');
                if (!accounts.length) {
                    container.innerHTML = '<span class="text-gray-500">No accounts connected yet.</span>';
                    return;
                }
                container.innerHTML = accounts.map(acc => `
                    <div class="bg-[#0a0d12] p-2.5 rounded border border-[#1f293d] flex justify-between items-center">
                        <div>
                            <div class="text-white font-bold">#${acc.login}</div>
                            <div class="text-[10px] text-gray-400">${acc.server}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-emerald-400">$${acc.balance.toFixed(2)}</div>
                            <div class="text-[10px] text-gray-400">P/L: $${acc.profit.toFixed(2)}</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {}
        }

        function connectWS() {
            const ws = new WebSocket(`ws://127.0.0.1:8000/ws`);
            ws.onopen = () => {
                document.getElementById('connectionStatus').innerText = 'Connected to Local Bridge';
                document.getElementById('connectionStatus').className = 'text-xs font-mono px-2 py-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                fetchAccounts();
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'MARKET_UPDATE') {
                    document.getElementById('priceDisplay').innerText = '$' + data.currentPrice.toFixed(2);
                    document.getElementById('symbolDisplay').innerText = data.symbol;
                    document.getElementById('scoreDisplay').innerText = 'Confluence Score: ' + data.score + '%';
                    
                    const badge = document.getElementById('signalBadge');
                    badge.innerText = data.signal;
                    badge.className = data.signal === 'BUY' ? 'text-xl font-black text-emerald-400' : (data.signal === 'SELL' ? 'text-xl font-black text-red-400' : 'text-xl font-black text-gray-500');

                    chartCandles = data.candles;
                    renderChart();
                }
            };
            ws.onclose = () => {
                document.getElementById('connectionStatus').innerText = 'Disconnected (Reconnecting...)';
                document.getElementById('connectionStatus').className = 'text-xs font-mono px-2 py-1 rounded bg-red-500/20 text-red-400 border border-red-500/30';
                setTimeout(connectWS, 3000);
            };
        }

        function renderChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!chartCandles.length) return;

            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            let min = Math.min(...chartCandles.map(c => c.low));
            let max = Math.max(...chartCandles.map(c => c.high));
            const range = max - min || 1;
            const w = canvas.width / chartCandles.length;

            chartCandles.forEach((c, i) => {
                const x = i * w + w / 2;
                const openY = canvas.height - ((c.open - min) / range) * canvas.height;
                const closeY = canvas.height - ((c.close - min) / range) * canvas.height;
                const highY = canvas.height - ((c.high - min) / range) * canvas.height;
                const lowY = canvas.height - ((c.low - min) / range) * canvas.height;

                ctx.strokeStyle = c.close >= c.open ? '#10b981' : '#ef4444';
                ctx.beginPath(); ctx.moveTo(x, highY); ctx.lineTo(x, lowY); ctx.stroke();
                ctx.fillStyle = ctx.strokeStyle;
                ctx.fillRect(x - w * 0.3, Math.min(openY, closeY), w * 0.6, Math.max(Math.abs(closeY - openY), 1));
            });
        }

        window.addEventListener('DOMContentLoaded', connectWS);
        setInterval(fetchAccounts, 5000);
    </script>
</body>
</html>
